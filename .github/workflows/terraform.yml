name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      action:
        description: "Stand up or tear down the dev demo environment"
        type: choice
        options: [apply, destroy]
        default: apply

permissions:
  id-token: write   # OIDC token for aws-actions/configure-aws-credentials
  contents: read
  pull-requests: write  # post plan output as PR comment

env:
  TF_VERSION: "1.10.5"
  AWS_REGION: "eu-west-2"
  APP_NAME: "threetier"

jobs:
  # ── Validate & Plan ──────────────────────────────────────────────────────────
  terraform-plan:
    name: Terraform Validate & Plan
    runs-on: ubuntu-latest
    # workflow_dispatch is handled exclusively by demo-dispatch below — running
    # both against the same dev state concurrently causes a state-lock conflict
    if: github.event_name != 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init

      - name: Select workspace
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            WORKSPACE=prod
          else
            WORKSPACE=dev
          fi
          terraform workspace select "$WORKSPACE" || terraform workspace new "$WORKSPACE"

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color -out=tfplan
        continue-on-error: true

      - name: Post plan to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const output = [
              '#### Terraform Plan `${{ steps.plan.outcome }}`',
              '<details><summary>Show Plan</summary>',
              '',
              '```',
              `${{ steps.plan.outputs.stdout }}`,
              '```',
              '</details>'
            ].join('\n');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

      - name: Fail if plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1

      - name: Upload plan artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: tfplan
          retention-days: 1

  # ── Apply (main only) ────────────────────────────────────────────────────────
  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: terraform-plan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init

      - name: Select prod workspace
        run: terraform workspace select prod || terraform workspace new prod

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

  # ── Build & Deploy Container (main only, after apply) ────────────────────────
  docker-deploy:
    name: Build, Push & Deploy Container
    runs-on: ubuntu-latest
    needs: terraform-apply
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image
        env:
          REGISTRY:   ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ env.APP_NAME }}-prod
          IMAGE_TAG:  ${{ github.sha }}
        run: |
          docker build \
            --tag "$REGISTRY/$REPOSITORY:$IMAGE_TAG" \
            --tag "$REGISTRY/$REPOSITORY:latest" \
            ./app
          docker push "$REGISTRY/$REPOSITORY:$IMAGE_TAG"
          docker push "$REGISTRY/$REPOSITORY:latest"

      - name: Force ECS redeployment
        run: |
          aws ecs update-service \
            --cluster  "${{ env.APP_NAME }}-prod-cluster" \
            --service  "${{ env.APP_NAME }}-prod-service" \
            --force-new-deployment \
            --region   "${{ env.AWS_REGION }}"

      - name: Wait for ECS service stability
        run: |
          aws ecs wait services-stable \
            --cluster "${{ env.APP_NAME }}-prod-cluster" \
            --services "${{ env.APP_NAME }}-prod-service" \
            --region  "${{ env.AWS_REGION }}"

  # ── On-demand demo environment (manual trigger only, dev workspace) ─────────
  # dev has no deletion_protection on the ALB/RDS, so destroy always succeeds —
  # use this to stand the app up before an interview and tear it down after.
  demo-dispatch:
    name: "Demo: ${{ github.event.inputs.action }} (dev)"
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init

      - name: Select dev workspace
        run: terraform workspace select dev || terraform workspace new dev

      - name: Terraform Apply (dev)
        if: github.event.inputs.action == 'apply'
        run: terraform apply -auto-approve

      - name: Login to Amazon ECR
        if: github.event.inputs.action == 'apply'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image
        if: github.event.inputs.action == 'apply'
        run: |
          REGISTRY="${{ steps.login-ecr.outputs.registry }}"
          REPOSITORY=$(terraform output -raw ecr_repository_url | cut -d/ -f2)
          docker build --tag "$REGISTRY/$REPOSITORY:latest" ./app
          docker push "$REGISTRY/$REPOSITORY:latest"

      - name: Force ECS redeployment (dev)
        if: github.event.inputs.action == 'apply'
        run: |
          aws ecs update-service \
            --cluster  "$(terraform output -raw ecs_cluster_name)" \
            --service  "$(terraform output -raw ecs_service_name)" \
            --force-new-deployment \
            --region   "${{ env.AWS_REGION }}"

      - name: Wait for ECS service stability
        if: github.event.inputs.action == 'apply'
        run: |
          aws ecs wait services-stable \
            --cluster  "$(terraform output -raw ecs_cluster_name)" \
            --services "$(terraform output -raw ecs_service_name)" \
            --region   "${{ env.AWS_REGION }}"

      - name: Print demo URL
        if: github.event.inputs.action == 'apply'
        run: |
          echo "### Demo environment is live" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**URL:** http://$(terraform output -raw alb_dns_name)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Remember to re-run this workflow with \`destroy\` when you're done to stop billing." >> "$GITHUB_STEP_SUMMARY"

      - name: Terraform Destroy (dev)
        if: github.event.inputs.action == 'destroy'
        run: terraform destroy -auto-approve
